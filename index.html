<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mergezzle — le puzzle de fusion rétro-gaming</title>
  <meta name="description" content="Mergezzle : fusionne câble, manette, borne d'arcade... jusqu'au trophée doré. Bientôt sur iOS et Android.">
  <meta property="og:title" content="Mergezzle — le puzzle de fusion rétro-gaming">
  <meta property="og:description" content="Du câble solitaire au trophée doré.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="mergezzle-icon.png">
  <link rel="icon" type="image/png" href="mergezzle-icon.png">
  <link rel="apple-touch-icon" href="mergezzle-icon.png">
  <style>
    :root { --bg:#f5f5fa; --card:#ffffff; --fg:#1a1b30; --muted:#5a5c78; --border:#e2e2ee; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1020; --card:#1a1b30; --fg:#e8e8f0; --muted:#a7a8c0; --border:#2a2c4a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      max-width: 460px; width: 100%; padding: 44px 36px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
    }
    .logo { width: 84px; height: 84px; border-radius: 20px; margin: 0 auto 20px; display: block; }
    h1 { margin: 0 0 12px; font-size: 30px; letter-spacing: -.5px; }
    p.tag { color: var(--muted); margin: 0 0 32px; font-size: 17px; line-height: 1.5; }
    .status {
      display: inline-block; padding: 10px 20px; border: 1px solid var(--border);
      border-radius: 999px; font-size: 14px; font-weight: 600;
    }
    .legal { margin-top: 36px; }
    .legal a { color: var(--muted); font-size: 13px; text-decoration: underline; }
    .legal a:hover { color: var(--fg); }
    footer { margin-top: 12px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="mergezzle-icon.png" width="84" height="84" alt="Mergezzle">
    <h1>Mergezzle</h1>
    <p class="tag">Fusionne le câble, la manette, la borne d'arcade... jusqu'au trophée doré.</p>
    <div class="status">Bientôt disponible sur iOS et Android</div>
    <div class="legal"><a href="./legal/">Politique de confidentialité &amp; mentions légales</a></div>
    <footer>© 2026 Damdes Studio</footer>
  </main>
</body>
</html>
